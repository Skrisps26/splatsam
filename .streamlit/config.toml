[global]
# Avoid the upstream ForwardMsg-cache race during fragment/widget updates.
# https://github.com/streamlit/streamlit/issues/17265
minCachedMessageSize = 1000000000000

[theme]
base = "dark"
primaryColor = "#9b93ff"
backgroundColor = "#080d18"
secondaryBackgroundColor = "#101827"
textColor = "#f1f5ff"
font = "sans serif"

[server]
maxUploadSize = 100

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
