<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d18" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    
    <linearGradient id="stage1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="stage2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="stage3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="stage4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accent-mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="accent-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>

    <marker id="arrow-mint" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>

    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .heading { font-weight: 700; fill: #f8fafc; font-size: 15px; letter-spacing: -0.01em; }
    .sub { font-size: 12px; fill: #94a3b8; }
    .badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .label { font-size: 11px; fill: #cbd5e1; font-weight: 500; }
    .card-title { font-weight: 600; font-size: 13.5px; fill: #ffffff; }
    .card-detail { font-size: 11.5px; fill: #94a3b8; }
    .edge-text { font-size: 10.5px; fill: #64748b; font-weight: 500; }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="16" />
  <rect width="100%" height="100%" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16" />

  <!-- TOP TITLE BAR -->
  <g transform="translate(40, 36)">
    <circle cx="10" cy="10" r="6" fill="#818cf8" />
    <text x="26" y="15" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.03em">SplatSAM Architecture</text>
    <text x="260" y="15" fill="#64748b" font-size="13" font-weight="500">Autonomous Video-to-Simulation Pipeline &amp; Meta Model Tuning Loop</text>
  </g>

  <!-- 4 HORIZONTAL / VERTICAL SECTIONS -->

  <!-- ==================== STAGE 1: PERCEPTION ==================== -->
  <g transform="translate(40, 80)">
    <rect width="455" height="260" rx="14" fill="url(#stage1)" stroke="#312e81" stroke-width="1.5" filter="url(#shadow)" />
    <text x="24" y="32" class="badge" fill="#818cf8">Stage 01</text>
    <text x="24" y="54" class="heading">Multimodal Perception &amp; Video Tracking</text>

    <!-- Node: Input Video -->
    <g transform="translate(24, 75)">
      <rect width="190" height="68" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">📱 Tabletop Video</text>
      <text x="16" y="48" class="card-detail">H.264 MP4 · Casual Phone Feed</text>
    </g>

    <!-- Node: SAM 3.1 -->
    <g transform="translate(242, 75)">
      <rect width="190" height="68" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">🎯 Meta SAM 3.1</text>
      <text x="16" y="48" class="card-detail">Files API · Video Tracking</text>
    </g>

    <!-- Node: Muse Wonder Semantic Prior -->
    <g transform="translate(24, 165)">
      <rect width="190" height="68" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">🧠 Muse Wonder 1.0</text>
      <text x="16" y="48" class="card-detail">Scene Semantics &amp; Priors</text>
    </g>

    <!-- Node: Persistent Tracks -->
    <g transform="translate(242, 165)">
      <rect width="190" height="68" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">🎞️ Persistent Tracks</text>
      <text x="16" y="48" class="card-detail">Consistent Object Silhouettes</text>
    </g>

    <!-- Connectors inside Stage 1 -->
    <path d="M 214 109 L 234 109" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <path d="M 119 143 L 119 157" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <path d="M 214 199 L 234 199" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <path d="M 337 143 L 337 157" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  </g>

  <!-- ==================== STAGE 2: RECONSTRUCTION ==================== -->
  <g transform="translate(525, 80)">
    <rect width="455" height="260" rx="14" fill="url(#stage2)" stroke="#065f46" stroke-width="1.5" filter="url(#shadow)" />
    <text x="24" y="32" class="badge" fill="#34d399">Stage 02</text>
    <text x="24" y="54" class="heading">Metric Scene &amp; Physics Digital Twin</text>

    <!-- Node: Homography -->
    <g transform="translate(24, 75)">
      <rect width="190" height="68" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">📐 Scale Homography</text>
      <text x="16" y="48" class="card-detail">Laptop / A4 Reference Plane</text>
    </g>

    <!-- Node: Metric Footprints -->
    <g transform="translate(242, 75)">
      <rect width="190" height="68" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">🔲 Metric Footprints</text>
      <text x="16" y="48" class="card-detail">1 mm / pixel Warped Silhouettes</text>
    </g>

    <!-- Node: Primitive Fitting -->
    <g transform="translate(24, 165)">
      <rect width="190" height="68" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">🧊 3D Primitive Fitting</text>
      <text x="16" y="48" class="card-detail">Boxes, Cylinders, Spheres</text>
    </g>

    <!-- Node: MuJoCo Scene -->
    <g transform="translate(242, 165)">
      <rect width="190" height="68" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">🪐 MuJoCo Environment</text>
      <text x="16" y="48" class="card-detail">Native XML · Contact Physics</text>
    </g>

    <!-- Connectors inside Stage 2 -->
    <path d="M 214 109 L 234 109" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <path d="M 337 143 L 337 155 L 119 155 L 119 160" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <path d="M 214 199 L 234 199" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arrow-mint)" />
  </g>

  <!-- CONNECTOR STAGE 1 -> STAGE 2 -->
  <path d="M 495 245 L 517 245 L 517 155 L 541 155" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- ==================== STAGE 3: AUTONOMOUS TUNING LOOP ==================== -->
  <g transform="translate(40, 370)">
    <rect width="590" height="305" rx="14" fill="url(#stage3)" stroke="#581c87" stroke-width="1.5" filter="url(#shadow)" />
    <text x="24" y="32" class="badge" fill="#c084fc">Stage 03</text>
    <text x="24" y="54" class="heading">Autonomous Model Tuning &amp; Physics Trials</text>

    <!-- Node: Curriculum -->
    <g transform="translate(24, 75)">
      <rect width="160" height="68" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
      <text x="14" y="28" class="card-title">🎲 Curriculum</text>
      <text x="14" y="48" class="card-detail">Jitter &amp; Friction Scales</text>
    </g>

    <!-- Node: MuJoCo Trials -->
    <g transform="translate(214, 75)">
      <rect width="170" height="68" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
      <text x="14" y="28" class="card-title">⚡ MuJoCo Physics</text>
      <text x="14" y="48" class="card-detail">Parallel-Jaw Grasp Trials</text>
    </g>

    <!-- Node: Muse Spark Failure Critic -->
    <g transform="translate(414, 75)">
      <rect width="152" height="68" rx="10" fill="#2e1065" stroke="#c084fc" stroke-width="1.5" />
      <text x="14" y="28" class="card-title">🔬 Muse Spark 1.3</text>
      <text x="14" y="48" class="card-detail">Visual Failure Critic</text>
    </g>

    <!-- Node: Muse Wonder Proposer -->
    <g transform="translate(214, 185)">
      <rect width="170" height="74" rx="10" fill="#2e1065" stroke="#c084fc" stroke-width="1.5" />
      <text x="14" y="26" class="card-title">💡 Muse Wonder 1.0</text>
      <text x="14" y="45" class="card-detail">Bounded Patch Proposer</text>
      <text x="14" y="62" class="card-detail" fill="#a855f7">Strict JSON Schema</text>
    </g>

    <!-- Node: Bootstrap Gate -->
    <g transform="translate(414, 185)">
      <rect width="152" height="74" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5" />
      <text x="14" y="26" class="card-title">⚖️ Bootstrap Gate</text>
      <text x="14" y="45" class="card-detail">p &lt; 0.05, n=10,000</text>
      <text x="14" y="62" class="card-detail" fill="#f59e0b">Regression Guard</text>
    </g>

    <!-- Connectors inside Stage 3 -->
    <path d="M 184 109 L 206 109" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <path d="M 384 109 L 406 109" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)" />
    <text x="325" y="66" class="edge-text">Failure Keyframes</text>
    
    <path d="M 490 143 L 490 160 L 300 160 L 300 177" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)" />
    <text x="345" y="154" class="edge-text">Diagnostic Reason</text>

    <path d="M 384 222 L 406 222" stroke="#fbbf24" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <text x="325" y="240" class="edge-text">Patch Proposal</text>

    <!-- Feedback loop: Accepted / Rejected -->
    <path d="M 490 185 L 490 168 L 330 168 L 330 151" stroke="#34d399" stroke-width="1.8" stroke-dasharray="4" fill="none" marker-end="url(#arrow-mint)" />
    <text x="440" y="163" class="edge-text" fill="#34d399">Accepted: Update</text>

    <path d="M 414 235 L 392 235" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3" fill="none" marker-end="url(#arrow)" />
    <text x="408" y="250" class="edge-text" fill="#f43f5e">Rejected</text>
  </g>

  <!-- CONNECTOR STAGE 2 -> STAGE 3 -->
  <path d="M 767 340 L 767 355 L 120 355 L 120 440" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrow-mint)" />

  <!-- ==================== STAGE 4: EVALUATION & COCKPIT ==================== -->
  <g transform="translate(655, 370)">
    <rect width="325" height="305" rx="14" fill="url(#stage4)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="24" y="32" class="badge" fill="#94a3b8">Stage 04</text>
    <text x="24" y="54" class="heading">Evaluation &amp; Interactive Cockpit</text>

    <!-- Node: Sealed Held-Out Test -->
    <g transform="translate(24, 75)">
      <rect width="277" height="68" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5" />
      <text x="16" y="28" class="card-title">🔒 One-Shot Sealed Test</text>
      <text x="16" y="48" class="card-detail">200 Held-Out Scenarios · Wilson CIs</text>
    </g>

    <!-- Node: Streamlit Cockpit -->
    <g transform="translate(24, 175)">
      <rect width="277" height="96" rx="10" fill="#18181b" stroke="#818cf8" stroke-width="2" />
      <text x="16" y="28" class="card-title">💻 Streamlit Cockpit</text>
      <text x="16" y="48" class="card-detail">SHA-256 Content-Hash Video Match</text>
      <text x="16" y="66" class="card-detail">3D Orbits · Grasp Replays · Token Logs</text>
      <text x="16" y="84" class="card-detail" fill="#818cf8">http://localhost:8501</text>
    </g>

    <!-- Connectors inside Stage 4 -->
    <path d="M 162 143 L 162 167" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  </g>

  <!-- CONNECTOR STAGE 3 -> STAGE 4 -->
  <path d="M 630 480 L 671 480" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4" fill="none" marker-end="url(#arrow)" />
  <path d="M 384 414 L 647 414 L 647 605 L 671 605" stroke="#818cf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

</svg>
