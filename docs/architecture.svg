<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d18" />
      <stop offset="100%" stop-color="#0d1524" />
    </linearGradient>
    
    <linearGradient id="panel-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="100%" stop-color="#0f1523" />
    </linearGradient>

    <linearGradient id="panel-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="100%" stop-color="#0c181f" />
    </linearGradient>

    <linearGradient id="panel-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a152e" />
      <stop offset="100%" stop-color="#100e1f" />
    </linearGradient>

    <linearGradient id="panel-4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#0f1118" />
    </linearGradient>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b" />
    </marker>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>

    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#c084fc" />
    </marker>

    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399" />
    </marker>

    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>

    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title-main { font-weight: 800; fill: #f8fafc; font-size: 19px; letter-spacing: -0.02em; }
    .title-sub { font-size: 13px; fill: #64748b; font-weight: 500; }
    .stage-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .stage-heading { font-weight: 700; fill: #f1f5f9; font-size: 14.5px; letter-spacing: -0.01em; }
    .node-title { font-weight: 600; font-size: 13px; fill: #ffffff; }
    .node-desc { font-size: 11px; fill: #94a3b8; }
    .edge-label { font-size: 10px; fill: #94a3b8; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="16" />
  <rect width="100%" height="100%" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16" />

  <!-- Title Header -->
  <g transform="translate(40, 36)">
    <rect width="8" height="22" rx="3" fill="#818cf8" />
    <text x="20" y="17" class="title-main">SplatSAM Architecture</text>
    <text x="240" y="17" class="title-sub">Video-to-Simulation Pipeline &amp; Closed-Loop Model Optimization</text>
  </g>

  <!-- ==================== STAGE 1: MULTIMODAL PERCEPTION ==================== -->
  <g transform="translate(40, 75)">
    <rect width="460" height="275" rx="12" fill="url(#panel-1)" stroke="#27274a" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="22" y="30" class="stage-badge" fill="#818cf8">Stage 01</text>
    <text x="22" y="52" class="stage-heading">Multimodal Perception &amp; Video Tracking</text>

    <!-- Node 1A: Input Video -->
    <g transform="translate(20, 72)">
      <rect width="195" height="72" rx="8" fill="#181a38" stroke="#4f46e5" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">Tabletop Workspace Video</text>
      <text x="14" y="46" class="node-desc">Casual Phone Feed · MP4</text>
      <text x="14" y="61" class="node-desc" fill="#818cf8">H.264 Raw Frames</text>
    </g>

    <!-- Node 1B: SAM 3.1 -->
    <g transform="translate(245, 72)">
      <rect width="195" height="72" rx="8" fill="#241438" stroke="#9333ea" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">Meta SAM 3.1</text>
      <text x="14" y="46" class="node-desc">Files API · Video Tracking</text>
      <text x="14" y="61" class="node-desc" fill="#c084fc">Streaming Mask Deltas</text>
    </g>

    <!-- Node 1C: Muse Wonder Semantics -->
    <g transform="translate(20, 175)">
      <rect width="195" height="72" rx="8" fill="#241438" stroke="#9333ea" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">Meta Muse Wonder 1.0</text>
      <text x="14" y="46" class="node-desc">Semantic Scene Extractor</text>
      <text x="14" y="61" class="node-desc" fill="#c084fc">Class &amp; Material Priors</text>
    </g>

    <!-- Node 1D: Persistent Tracks -->
    <g transform="translate(245, 175)">
      <rect width="195" height="72" rx="8" fill="#0f1d33" stroke="#0284c7" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">Persistent Object Tracks</text>
      <text x="14" y="46" class="node-desc">Consistent Object Identity</text>
      <text x="14" y="61" class="node-desc" fill="#38bdf8">Bounding Boxes &amp; Silhouettes</text>
    </g>

    <!-- Stage 1 Connections -->
    <path d="M 215 108 L 239 108" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)" />
    <path d="M 117 144 L 117 169" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)" />
    <path d="M 215 211 L 239 211" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)" />
    <path d="M 342 144 L 342 169" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)" />
  </g>

  <!-- ==================== STAGE 2: METRIC RECONSTRUCTION ==================== -->
  <g transform="translate(540, 75)">
    <rect width="460" height="275" rx="12" fill="url(#panel-2)" stroke="#163832" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="22" y="30" class="stage-badge" fill="#34d399">Stage 02</text>
    <text x="22" y="52" class="stage-heading">Metric Scene &amp; Physics Digital Twin</text>

    <!-- Node 2A: Homography -->
    <g transform="translate(20, 72)">
      <rect width="195" height="72" rx="8" fill="#0f1d33" stroke="#0284c7" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">Metric Scale Homography</text>
      <text x="14" y="46" class="node-desc">OpenCV Table-Plane Fitting</text>
      <text x="14" y="61" class="node-desc" fill="#38bdf8">Laptop / Reference Scale</text>
    </g>

    <!-- Node 2B: Footprints -->
    <g transform="translate(245, 72)">
      <rect width="195" height="72" rx="8" fill="#0f1d33" stroke="#0284c7" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">Planar Metric Footprints</text>
      <text x="14" y="46" class="node-desc">1 mm / Pixel Resolution</text>
      <text x="14" y="61" class="node-desc" fill="#38bdf8">Warped Silhouettes</text>
    </g>

    <!-- Node 2C: 3D Primitives -->
    <g transform="translate(20, 175)">
      <rect width="195" height="72" rx="8" fill="#0a2a22" stroke="#059669" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">3D Primitive Fitting</text>
      <text x="14" y="46" class="node-desc">Bounding Volumes &amp; Yaw</text>
      <text x="14" y="61" class="node-desc" fill="#34d399">Boxes, Cylinders, Spheres</text>
    </g>

    <!-- Node 2D: MuJoCo Sandbox -->
    <g transform="translate(245, 175)">
      <rect width="195" height="72" rx="8" fill="#0a2a22" stroke="#059669" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">MuJoCo Digital Twin</text>
      <text x="14" y="46" class="node-desc">Collision Geoms &amp; Masses</text>
      <text x="14" y="61" class="node-desc" fill="#34d399">Native Simulation XML</text>
    </g>

    <!-- Stage 2 Connections -->
    <path d="M 215 108 L 239 108" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)" />
    <path d="M 342 144 L 342 158 L 117 158 L 117 169" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)" />
    <path d="M 215 211 L 239 211" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arr-green)" />
  </g>

  <!-- INTER-STAGE CONNECTION: Stage 1 -> Stage 2 (Between Cards) -->
  <path d="M 500 286 L 520 286 L 520 183 L 554 183" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />
  <rect x="506" y="224" width="28" height="18" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="520" y="236" text-anchor="middle" font-size="9" font-weight="700" fill="#38bdf8">IOU</text>

  <!-- ==================== STAGE 3: AUTONOMOUS MODEL TUNING LOOP ==================== -->
  <g transform="translate(40, 390)">
    <rect width="605" height="305" rx="12" fill="url(#panel-3)" stroke="#392652" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="22" y="30" class="stage-badge" fill="#c084fc">Stage 03</text>
    <text x="22" y="52" class="stage-heading">Autonomous Model Tuning &amp; Physics Trials</text>

    <!-- Node 3A: Curriculum -->
    <g transform="translate(20, 72)">
      <rect width="165" height="72" rx="8" fill="#181a38" stroke="#4f46e5" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">Scenario Curriculum</text>
      <text x="14" y="46" class="node-desc">Randomized Physical Sets</text>
      <text x="14" y="61" class="node-desc" fill="#818cf8">Friction, Mass &amp; Jitter</text>
    </g>

    <!-- Node 3B: MuJoCo Trials -->
    <g transform="translate(215, 72)">
      <rect width="185" height="72" rx="8" fill="#0a2a22" stroke="#059669" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">MuJoCo Physics Engine</text>
      <text x="14" y="46" class="node-desc">Parallel-Jaw Grasp Trials</text>
      <text x="14" y="61" class="node-desc" fill="#34d399">Deterministic Contact Scoring</text>
    </g>

    <!-- Node 3C: Muse Spark Critic -->
    <g transform="translate(430, 72)">
      <rect width="155" height="72" rx="8" fill="#241438" stroke="#9333ea" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">Meta Muse Spark 1.3</text>
      <text x="14" y="46" class="node-desc">Visual Failure Critic</text>
      <text x="14" y="61" class="node-desc" fill="#c084fc">Multimodal Keyframe Diagnosis</text>
    </g>

    <!-- Node 3D: Muse Wonder Proposer -->
    <g transform="translate(215, 185)">
      <rect width="185" height="82" rx="8" fill="#241438" stroke="#9333ea" stroke-width="1.5" />
      <text x="14" y="25" class="node-title">Meta Muse Wonder 1.0</text>
      <text x="14" y="44" class="node-desc">Bounded Patch Proposer</text>
      <text x="14" y="60" class="node-desc" fill="#c084fc">Speeds, Elevation, Margins</text>
      <text x="14" y="74" class="node-desc" fill="#a855f7">Strict JSON Schema</text>
    </g>

    <!-- Node 3E: Bootstrap Gate -->
    <g transform="translate(430, 185)">
      <rect width="155" height="82" rx="8" fill="#2d1c0b" stroke="#d97706" stroke-width="1.5" />
      <text x="14" y="25" class="node-title">Bootstrap Gate</text>
      <text x="14" y="44" class="node-desc">p &lt; 0.05 · n=10,000</text>
      <text x="14" y="60" class="node-desc" fill="#fbbf24">Paired Difference Test</text>
      <text x="14" y="74" class="node-desc" fill="#f59e0b">Regression Guard</text>
    </g>

    <!-- Stage 3 Internal Connections -->
    <path d="M 185 108 L 209 108" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)" />
    
    <!-- MuJoCo -> Spark (Slip Frames) -->
    <path d="M 400 96 L 424 96" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#arr-purple)" />
    <rect x="398" y="82" width="28" height="14" rx="3" fill="#1e1333" />
    <text x="412" y="93" class="edge-label" text-anchor="middle" fill="#c084fc">SLIP</text>

    <!-- Spark -> Wonder (Diagnosis Context) -->
    <path d="M 507 144 L 507 165 L 360 165 L 360 180" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#arr-purple)" />
    <rect x="424" y="157" width="56" height="15" rx="3" fill="#1e1333" />
    <text x="452" y="168" class="edge-label" text-anchor="middle" fill="#c084fc">DIAGNOSIS</text>

    <!-- MuJoCo -> Wonder (Trial Stats) -->
    <path d="M 260 144 L 260 180" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arr-green)" />
    <rect x="238" y="157" width="44" height="15" rx="3" fill="#0d241c" />
    <text x="260" y="168" class="edge-label" text-anchor="middle" fill="#34d399">STATS</text>

    <!-- Wonder -> Gate (Patch Proposal) -->
    <path d="M 400 226 L 424 226" stroke="#fbbf24" stroke-width="1.5" fill="none" marker-end="url(#arr-amber)" />
    <rect x="397" y="218" width="30" height="15" rx="3" fill="#2d1c0b" />
    <text x="412" y="229" class="edge-label" text-anchor="middle" fill="#fbbf24">PATCH</text>

    <!-- Gate -> MuJoCo (Accepted: Update Planner) -->
    <path d="M 440 185 L 440 160 L 390 160 L 390 149" stroke="#34d399" stroke-width="1.8" stroke-dasharray="4" fill="none" marker-end="url(#arr-green)" />
    <rect x="422" y="166" width="36" height="15" rx="3" fill="#0d241c" />
    <text x="440" y="177" class="edge-label" text-anchor="middle" fill="#34d399">ACCEPT</text>

    <!-- Gate -> Wonder (Rejected: Retain History) -->
    <path d="M 507 267 L 507 284 L 307 284 L 307 272" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3" fill="none" marker-end="url(#arr-rose)" />
    <rect x="382" y="276" width="60" height="15" rx="3" fill="#291218" />
    <text x="412" y="287" class="edge-label" text-anchor="middle" fill="#f43f5e">REJECTED</text>
  </g>

  <!-- INTER-STAGE CONNECTION: Stage 2 -> Stage 3 (Along Outside Margin) -->
  <path d="M 882 350 L 882 372 L 20 372 L 20 500 L 54 500" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arr-green)" />

  <!-- ==================== STAGE 4: EVALUATION & COCKPIT ==================== -->
  <g transform="translate(675, 390)">
    <rect width="325" height="305" rx="12" fill="url(#panel-4)" stroke="#272733" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="22" y="30" class="stage-badge" fill="#94a3b8">Stage 04</text>
    <text x="22" y="52" class="stage-heading">Evaluation &amp; Interactive Cockpit</text>

    <!-- Node 4A: Sealed Test -->
    <g transform="translate(20, 72)">
      <rect width="285" height="72" rx="8" fill="#2d1c0b" stroke="#d97706" stroke-width="1.5" />
      <text x="14" y="27" class="node-title">One-Shot Sealed Benchmark</text>
      <text x="14" y="46" class="node-desc">200 Held-Out Disjoint Scenarios</text>
      <text x="14" y="61" class="node-desc" fill="#fbbf24">Wilson 95% Confidence Intervals</text>
    </g>

    <!-- Node 4B: Streamlit Cockpit -->
    <g transform="translate(20, 175)">
      <rect width="285" height="95" rx="8" fill="#14141f" stroke="#6366f1" stroke-width="2" />
      <text x="14" y="26" class="node-title">Interactive Streamlit Cockpit</text>
      <text x="14" y="45" class="node-desc">SHA-256 Content-Hash Video Match</text>
      <text x="14" y="62" class="node-desc">3D Orbits · Grasp Replays · Token Traces</text>
      <text x="14" y="80" class="node-desc" fill="#818cf8">http://localhost:8501</text>
    </g>

    <!-- Stage 4 Internal Connection: Sealed Test -> Cockpit -->
    <path d="M 162 144 L 162 169" stroke="#fbbf24" stroke-width="1.5" fill="none" marker-end="url(#arr-amber)" />
  </g>

  <!-- INTER-STAGE CONNECTION: Stage 3 Gate -> Stage 4 Sealed Test -->
  <path d="M 645 616 L 660 616 L 660 498 L 689 498" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4" fill="none" marker-end="url(#arr-amber)" />
  <rect x="646" y="546" width="28" height="18" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="660" y="558" text-anchor="middle" font-size="9" font-weight="700" fill="#fbbf24">LOCK</text>

  <!-- INTER-STAGE CONNECTION: Stage 3 MuJoCo -> Stage 4 Cockpit -->
  <path d="M 645 640 L 689 640" stroke="#818cf8" stroke-width="2" fill="none" marker-end="url(#arr-blue)" />

</svg>
