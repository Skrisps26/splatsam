[project]
name = "splatsam"
version = "0.1.0"
description = "Synthetic-first video to physics workspace evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
 "mujoco>=3.3", "numpy>=2.2", "scipy>=1.15", "statsmodels>=0.14",
 "trimesh>=4.6", "opencv-contrib-python>=4.11", "openai>=1.75", "meta-sam-parser==0.1.0",
 "pydantic>=2.10", "tenacity>=9", "diskcache>=5.6", "pyyaml>=6",
 "streamlit>=1.66.1", "plotly>=6", "imageio>=2.37", "imageio-ffmpeg>=0.6",
 "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "python-multipart>=0.0.20",
]
[project.optional-dependencies]
mesh = ["coacd>=1.0"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
